name: PR Agent (Gemini)

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:

jobs:
  pr_agent_job:
    # ignore bot/agent comments to avoid feedback loops
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:            # max perms the action needs
      issues: write
      pull-requests: write
      contents: write       # /improve can push code suggestions
      checks: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gemini provider (no OPENAI_KEY needed) — 1.5 series retired, use 2.x.
          # Free tier caps at 5 req/min: flash primary (fast calls), serialize
          # suggestion generation, generous timeout for quota slowness.
          config.model: "gemini/gemini-2.5-flash"
          config.fallback_models: '["gemini/gemini-2.5-flash"]'
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # auto-run full review on PR events; /describe and /improve on demand
          # (fewer automatic calls = stays under free-tier 5 req/min quota)
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "synchronize", "ready_for_review"]'
          # one LLM call at a time avoids 429 bursts; timeout fits slow quota windows
          pr_code_suggestions.parallel_calls: "false"
          config.ai_timeout: "300"