version: "3"

env:
  PROVISR_ROOT: "{{.PWD}}"

tasks:
  default:
    desc: Show available tasks
    cmd: task --list

  # ── Install ──
  install:
    desc: Install all dependencies
    cmds:
      - pnpm install
      - (cd agent && uv sync)
      - (cd mcp && uv sync)

  # ── Dev (native) ──
  dev:
    desc: Start all services (native hot-reload)
    cmd: ./scripts/dev.sh

  dev:backend:
    desc: Start Go backend services only
    cmd: ./scripts/dev-backend.sh

  dev:agent:
    desc: Start agent + MCP only
    cmd: ./scripts/dev-agent.sh

  dev:orchestrator:
    desc: Start orchestrator only
    cmd: ./scripts/dev-orchestrator.sh

  dev:frontend:
    desc: Start frontend only
    cmd: ./scripts/dev-frontend.sh

  dev:service:
    desc: Start single backend service
    cmd: ./scripts/dev-service.sh {{.SERVICE}}

  # ── Build ──
  build:
    desc: Build all layers
    cmds:
      - task: build:go
      - task: build:ts
      - task: build:py

  build:go:
    desc: Build all Go services
    dir: backend
    cmd: go build ./cmd/...

  build:ts:
    desc: Build TypeScript packages
    cmds:
      - pnpm --filter @provisr/shared-contracts build
      - pnpm --filter @provisr/orchestrator build
      - pnpm --filter @provisr/frontend build

  build:py:
    desc: Check Python packages compile
    cmds:
      - (cd agent && uv run python -m compileall src)
      - (cd mcp && uv run python -m compileall src)

  # ── Test ──
  test:
    desc: Run all tests
    cmds:
      - task: test:go
      - task: test:ts
      - task: test:py

  test:go:
    desc: Run Go tests
    dir: backend
    cmd: go test ./...

  test:ts:
    desc: Run TypeScript tests
    cmds:
      - pnpm --filter @provisr/orchestrator test
      - pnpm --filter @provisr/frontend test

  test:py:
    desc: Run Python tests
    cmds:
      - (cd agent && uv run pytest)
      - (cd mcp && uv run pytest)

  # ── Lint ──
  lint:
    desc: Lint all code
    cmds:
      - task: lint:go
      - task: lint:ts
      - task: lint:py

  lint:go:
    desc: Lint Go code
    dir: backend
    cmd: golangci-lint run ./...

  lint:ts:
    desc: Lint TypeScript code
    cmd: pnpm -r lint

  lint:py:
    desc: Lint Python code
    cmds:
      - (cd agent && uv run ruff check src)
      - (cd mcp && uv run ruff check src)

  # ── Proto ──
  proto:
    desc: Generate code from protobuf
    cmd: buf generate

  proto:lint:
    desc: Lint protobuf
    cmd: buf lint

  # ── Docker ──
  docker:up:
    desc: Start all services with Docker
    dir: infra/docker
    cmd: docker compose --profile all up

  docker:backend:
    desc: Start backend only with Docker
    dir: infra/docker
    cmd: docker compose --profile backend up

  docker:agent:
    desc: Start agent + MCP with Docker
    dir: infra/docker
    cmd: docker compose --profile agent up

  docker:frontend:
    desc: Start frontend with Docker
    dir: infra/docker
    cmd: docker compose --profile frontend up

  docker:orchestrator:
    desc: Start orchestrator with Docker
    dir: infra/docker
    cmd: docker compose --profile orchestrator up