[project]
name = "provisr-agent"
version = "0.1.0"
description = "AI orchestration service for Provisr infrastructure manifests"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "anthropic>=0.116.0",
  "fastapi>=0.116,<1",
  "google-genai>=2.11.0",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

