syntax = "proto3";

package state.v1;

option go_package = "github.com/provisr/platform/proto/gen/go/state/v1;statev1";

message Resource {
  string resource_id = 1;
  string org_id = 2;
  string provider = 3;
  string resource_type = 4;
  string display_name = 5;
  string status = 6;
  string region = 7;
}