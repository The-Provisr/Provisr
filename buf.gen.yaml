version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-go
    out: backend/pkg/protos
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: backend/pkg/protos
    opt: paths=source_relative
  - local: protoc-gen-es
    out: packages/shared-contracts/src/generated
    opt: target=ts