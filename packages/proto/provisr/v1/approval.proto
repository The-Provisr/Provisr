syntax = "proto3";

package provisr.v1;

option go_package = "github.com/provisr/backend/pkg/protos/provisr/v1";

message ApprovalTicket {
  string ticket_id = 1;
  string request_id = 2;
  string revision_id = 3;
  ApprovalStatus status = 4;
  double estimated_cost_usd = 5;
  string manifest_snapshot = 6;
  string policy_summary = 7;
}

message ApprovalStep {
  string step_id = 1;
  string ticket_id = 2;
  int32 step_number = 3;
  string required_role = 4;
  ApprovalStatus status = 5;
}

message ApprovalToken {
  string token_id = 1;
  string step_id = 2;
  string token_hash = 3;
  string action = 4;
  string issued_to_email = 5;
}

enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  APPROVED = 2;
  REJECTED = 3;
  EXPIRED = 4;
  APPROVAL_CANCELLED = 5;
}