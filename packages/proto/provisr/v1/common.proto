syntax = "proto3";

package provisr.v1;

option go_package = "github.com/provisr/backend/pkg/protos/provisr/v1";

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

message UUID {
  string value = 1;
}

message IdempotencyKey {
  string key = 1;
  string request_id = 2;
  string user_id = 3;
}