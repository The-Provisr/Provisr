syntax = "proto3";

package provisr.v1;

option go_package = "github.com/provisr/backend/pkg/protos/provisr/v1";

message PolicyEvaluation {
  string evaluation_id = 1;
  string request_id = 2;
  string revision_id = 3;
  string evaluation_phase = 4;
  PolicyDecision decision = 5;
  repeated Violation violations = 6;
  int32 policies_evaluated = 7;
}

message Violation {
  string policy_key = 1;
  string severity = 2;
  string message = 3;
  string rule_path = 4;
  string remediation_hint = 5;
}

enum PolicyDecision {
  POLICY_DECISION_UNSPECIFIED = 0;
  ALLOW = 1;
  WARN = 2;
  DENY = 3;
  REQUIRES_APPROVAL = 4;
  WAIVED = 5;
}