syntax = "proto3";

package provisr.v1;

option go_package = "github.com/provisr/backend/pkg/protos/provisr/v1";

message ProvisioningRequest {
  string request_id = 1;
  string workspace_id = 2;
  string submitter_user_id = 3;
  string idempotency_key = 4;
  RequestIntent intent = 5;
  RequestStatus status = 6;
  string nl_input = 7;
  string manifest_schema_version = 8;
  string correlation_id = 9;
}

message RequestRevision {
  string revision_id = 1;
  string request_id = 2;
  int32 revision_number = 3;
  string manifest_json = 4;
  string manifest_hash = 5;
  double estimated_cost_usd = 6;
  string change_summary = 7;
}

enum RequestIntent {
  REQUEST_INTENT_UNSPECIFIED = 0;
  CREATE = 1;
  UPDATE = 2;
  DESTROY = 3;
  IMPORT = 4;
  REPROVISION = 5;
}

enum RequestStatus {
  REQUEST_STATUS_UNSPECIFIED = 0;
  RECEIVED = 1;
  PENDING_AGENT = 2;
  PENDING_CLARIFICATION = 3;
  POLICY_CHECK = 4;
  PENDING_CONFIRMATION = 5;
  PENDING_APPROVAL = 6;
  PROVISIONING = 7;
  LIVE = 8;
  FAILED = 9;
  CANCELLED = 10;
}