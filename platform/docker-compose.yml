services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: provisr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: provisr
      POSTGRES_PASSWORD: provisr_dev
      POSTGRES_DB: provisr
    ports:
      - "5433:5432"
    volumes:
      - provisr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # Orchestration Service (State Machine)
  # -------------------------------------------------------------
  orchestration:
    build:
      context: .
      args:
        SERVICE_NAME: orchestration
    container_name: provisr-orchestration
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:secret@postgres:5432/provisr?sslmode=disable"
      EVENT_SUBSCRIBERS: '["http://audit:8085/v1/audit/events"]'
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # Policy Engine Service (OPA/Rego)
  # -------------------------------------------------------------
  policy:
    build:
      context: .
      args:
        SERVICE_NAME: policy
    container_name: provisr-policy
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # Audit Service (Event Logging)
  # -------------------------------------------------------------
  audit:
    build:
      context: .
      args:
        SERVICE_NAME: audit
    container_name: provisr-audit
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  provisr-db-data:
    name: provisr-db-data
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/000001_init_schema.up.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provisr -d provisr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: provisr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: provisr-localstack
    restart: unless-stopped
    ports:
      - "4566:4566" # single edge port for all emulated AWS services
    environment:
      SERVICES: sqs,s3,dynamodb,events
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    volumes:
      - localstackdata:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: provisr-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

volumes:
  pgdata:
  redisdata:
  localstackdata:
