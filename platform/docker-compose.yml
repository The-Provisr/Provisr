services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: provisr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: provisr
      POSTGRES_PASSWORD: provisr_dev
      POSTGRES_DB: provisr
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - provisr-db-data:/var/lib/postgresql/data
      - ./db/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/000001_init_schema.up.sql:ro
      - ./db/migrations/000002_add_orchestration_columns.up.sql:/docker-entrypoint-initdb.d/000002_add_orchestration_columns.up.sql:ro
      - ./db/migrations/000003_add_policy_configuration.up.sql:/docker-entrypoint-initdb.d/000003_add_policy_configuration.up.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provisr -d provisr"]
      interval: 5s
      timeout: 5s
      retries: 10

  orchestration:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE_NAME: orchestration
    container_name: provisr-orchestration
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://provisr:provisr_dev@postgres:5432/provisr?sslmode=disable"
      POLICY_SERVICE_URL: "http://policy:8080"
      EVENT_SUBSCRIBERS: '["http://audit:8085/v1/audit/events"]'
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      policy:
        condition: service_started

  policy:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE_NAME: policy
    container_name: provisr-policy
    ports:
      - "8083:8080"
    environment:
      DATABASE_URL: "postgres://provisr:provisr_dev@postgres:5432/provisr?sslmode=disable"
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

  approval:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE_NAME: approval
    container_name: provisr-approval
    ports:
      - "8084:8080"
    environment:
      ORCHESTRATION_SERVICE_URL: "http://orchestration:8080"
      PORT: "8080"
    depends_on:
      orchestration:
        condition: service_started

  audit:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE_NAME: audit
    container_name: provisr-audit
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: provisr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: provisr-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,s3,dynamodb,events
      DEBUG: 1
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
    volumes:
      - localstackdata:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: provisr-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  provisr-db-data:
  redisdata:
  localstackdata:
