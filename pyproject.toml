[project]
name = "provisr"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["agent", "mcp", "packages/manifest-contracts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["agent/tests", "mcp/tests"]
